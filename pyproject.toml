[project]
name = "governed-mcp"
version = "0.1.0"
description = "A governed, read-only MCP server: typed tools, per-caller row-level security, and deterministic guardrails — with an eval harness that proves leakage can't happen."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emory Long" }]
keywords = ["mcp", "model-context-protocol", "row-level-security", "guardrails", "governance", "llm", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.9",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
governed = "governed_mcp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governed_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
