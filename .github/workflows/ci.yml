name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp

      - name: Run tests
        run: uv run pytest

      - name: Run adversarial eval harness
        run: uv run governed eval

      - name: Smoke-test the CLI
        run: uv run governed verify
